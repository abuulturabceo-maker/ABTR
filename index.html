async function loadProducts() {

  const container =
    document.getElementById("products");


  container.innerHTML =
    '<div class="message">Ana loading Products...</div>';


  try {

    const snapshot =
      await db.collection("products").get();


    allProducts = [];

      allProducts.push({

        id: doc.id,

      });

    });
