<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABTR Admin – Product Manager</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f4f7f5;
color:#123b2a;
min-height:100vh;
}

header{
background:#087f3e;
color:white;
padding:20px;
text-align:center;
}

header h1{
margin-bottom:6px;
}

.back{
display:inline-block;
margin-top:10px;
color:white;
text-decoration:none;
}

#adminLogin{
width:92%;
max-width:420px;
margin:50px auto;
padding:25px;
background:white;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.10);
}

#adminLogin h2{
margin-bottom:10px;
}

#adminLogin p{
margin-bottom:18px;
line-height:1.5;
}

#adminLogin input{
width:100%;
padding:13px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

#loginBtn{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:8px;
background:#087f3e;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

#loginMessage{
margin-top:12px;
text-align:center;
}

#adminContent{
display:none;
}

.container{
width:92%;
max-width:900px;
margin:30px auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.logout-btn{
background:#c62828;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

.card h2{
margin-bottom:20px;
}

.notice{
background:#fff8d8;
border-left:5px solid #e0b000;
padding:15px;
line-height:1.6;
margin-bottom:20px;
border-radius:7px;
}

label{
display:block;
font-weight:bold;
margin:14px 0 7px;
}

input,
select,
textarea{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

.file-box{
border:2px dashed #087f3e;
padding:18px;
border-radius:10px;
text-align:center;
background:#f8fffb;
cursor:pointer;
}

.file-box input{
border:none;
padding:0;
}

#preview{
display:none;
width:100%;
max-height:300px;
object-fit:contain;
margin-top:15px;
border-radius:10px;
background:#eee;
}

.btn{
border:none;
padding:13px 20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
font-size:15px;
margin-top:18px;
}

.add-btn{
background:#087f3e;
color:white;
width:100%;
}

.clear-btn{
background:#ddd;
color:#333;
width:100%;
}

.product-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.product{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.product img{
width:100%;
height:180px;
object-fit:cover;
background:#eee;
}

.product-info{
padding:15px;
}

.product-info h3{
margin-bottom:8px;
}

.price{
color:#087f3e;
font-weight:bold;
font-size:18px;
margin-bottom:8px;
}

.category{
font-size:13px;
color:#666;
margin-bottom:8px;
}

.delete-btn{
width:100%;
background:#c62828;
color:white;
border:none;
padding:11px;
border-radius:7px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

#productMessage{
margin-top:15px;
text-align:center;
font-weight:bold;
}

#imageInfo{
margin-top:8px;
font-size:13px;
color:#666;
text-align:center;
}

@media(max-width:600px){

.container{
width:94%;
}

.topbar{
align-items:flex-start;
flex-direction:column;
}

}

</style>
</head>

<body>

<header>

<h1>ABTR 🛍️</h1>

<p>ABUL-TURAB Online Market</p>

<a href="index.html" class="back">
← Back to Website
</a>

</header>


<!-- LOGIN -->

<div id="adminLogin">

<h2>🔐 ABTR Admin Login</h2>

<p>
Shiga domin sarrafa kayayyakin ABTR.
</p>

<input
type="email"
id="adminEmail"
placeholder="Admin Email"
autocomplete="email"
>

<input
type="password"
id="adminPassword"
placeholder="Password"
autocomplete="current-password"
>

<button id="loginBtn">
🔑 Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN CONTENT -->

<div id="adminContent">

<div class="container">

<div class="topbar">

<h2>ABTR Product Manager</h2>

<button
class="logout-btn"
id="logoutBtn"
>
🚪 Logout
</button>

</div>


<div class="notice">

<strong>Admin Panel</strong>

<br>

Wannan shafin na ABTR ne domin sarrafa kayayyaki.

</div>


<!-- ADD PRODUCT -->

<div class="card">

<h2>➕ Add New Product</h2>

<form id="productForm">

<label>
Product Name
</label>

<input
type="text"
id="productName"
placeholder="Example: Premium Jallabiya"
required
>


<label>
Price
</label>

<input
type="number"
id="productPrice"
placeholder="25000"
min="1"
required
>


<label>
Category
</label>

<select
id="productCategory"
required
>

<option value="">
Select Category
</option>

<option value="Fashion">
Fashion
</option>

<option value="Phone Accessories">
Phone Accessories
</option>

<option value="Health Products">
Health Products
</option>

</select>


<label>
Product Description
</label>

<textarea
id="productDescription"
placeholder="Write a short description..."
></textarea>


<label>
Product Picture
</label>

<div class="file-box">

<input
type="file"
id="productImage"
accept="image/*"
required
>

<p style="margin-top:10px;">
📷 Zaɓi hoto daga Gallery
</p>

</div>

<img
id="preview"
alt="Product preview"
>

<div id="imageInfo"></div>


<button
type="submit"
class="btn add-btn"
id="addProductBtn"
>
➕ Add Product
</button>


<button
type="button"
class="btn clear-btn"
id="clearBtn"
>
Clear
</button>

<div id="productMessage"></div>

</form>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>
🛍️ Products
</h2>

<div
id="productList"
class="product-list"
></div>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyApvfs-5uTuJWd7tz73uycMPRdmX6RrGRw",

authDomain:
"abtr-online-market.firebaseapp.com",

projectId:
"abtr-online-market",

storageBucket:
"abtr-online-market.firebasestorage.app",

messagingSenderId:
"24953738228",

appId:
"1:24953738228:web:f4d45ec73a847e1c46dfa1",

measurementId:
"G-M2SPBLPXVN"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const adminLogin =
document.getElementById("adminLogin");

const adminContent =
document.getElementById("adminContent");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginMessage =
document.getElementById("loginMessage");

const productForm =
document.getElementById("productForm");

const productList =
document.getElementById("productList");

const productMessage =
document.getElementById("productMessage");

const productImage =
document.getElementById("productImage");

const preview =
document.getElementById("preview");

const imageInfo =
document.getElementById("imageInfo");

const addProductBtn =
document.getElementById("addProductBtn");


/* LOGIN */

loginBtn.addEventListener(
"click",
async function(){

const email =
document
.getElementById("adminEmail")
.value
.trim();

const password =
document
.getElementById("adminPassword")
.value;

if(!email || !password){

loginMessage.textContent =
"⚠️ Saka email da password.";

return;

}

loginMessage.textContent =
"⏳ Ana shiga...";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

loginMessage.textContent="";

}

catch(error){

console.error(error);

loginMessage.textContent =
"❌ Email ko password ba daidai ba ne.";

}

}
);


/* LOGOUT */

logoutBtn.addEventListener(
"click",
async function(){

await signOut(auth);

}
);


/* AUTH */

onAuthStateChanged(
auth,
function(user){

if(user){

adminLogin.style.display="none";

adminContent.style.display="block";

loadProducts();

}

else{

adminLogin.style.display="block";

adminContent.style.display="none";

}

}
);


/* IMAGE */

productImage.addEventListener(
"change",
async function(){

const file=this.files[0];

if(!file){

preview.style.display="none";

preview.src="";

imageInfo.textContent="";

return;

}

if(!file.type.startsWith("image/")){

alert("⚠️ Zaɓi hoto kawai.");

this.value="";

return;

}

imageInfo.textContent =
"⏳ Ana shirya hoton...";

try{

const compressedImage =
await compressImage(file);

preview.src =
compressedImage;

preview.style.display="block";

imageInfo.textContent =
"✅ An shirya hoton. Za ka iya danna Add Product.";

preview.dataset.image =
compressedImage;

}

catch(error){

console.error(error);

imageInfo.textContent =
"❌ An kasa shirya hoton.";

}

}
);


/* COMPRESS IMAGE */

function compressImage(file){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload =
function(event){

const img =
new Image();

img.onload =
function(){

const maxWidth=800;

const maxHeight=800;

let width=img.width;

let height=img.height;


if(width>maxWidth){

height =
height * maxWidth / width;

width=maxWidth;

}


if(height>maxHeight){

width =
width * maxHeight / height;

height=maxHeight;

}


const canvas =
document.createElement("canvas");

canvas.width=width;

canvas.height=height;


const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);


const compressed =
canvas.toDataURL(
"image/jpeg",
0.70
);


resolve(compressed);

};


img.onerror=reject;

img.src=event.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

}
}


/* ADD PRODUCT */

productForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


const name =
document
.getElementById("productName")
.value
.trim();


const price =
Number(
document
.getElementById("productPrice")
.value
);


const category =
document
.getElementById("productCategory")
.value;


const description =
document
.getElementById("productDescription")
.value
.trim();


const imageUrl =
preview.dataset.image || "";


if(!name || !price || !category || !imageUrl){

productMessage.textContent =
"⚠️ Cika bayanan product gaba ɗaya.";

return;

}


addProductBtn.disabled=true;

addProductBtn.textContent =
"⏳ Ana adding...";

productMessage.textContent="";


try{

await addDoc(
collection(db,"products"),
{

name:name,

price:price,

category:category,

description:description,

imageUrl:imageUrl,

createdAt:serverTimestamp()

}
);


productMessage.textContent =
"✅ An ƙara product cikin nasara!";


clearForm();

await loadProducts();

}

catch(error){

console.error(error);

productMessage.textContent =
"❌ An samu matsala: "+
error.message;

}


addProductBtn.disabled=false;

addProductBtn.textContent =
"➕ Add Product";

}
);


/* LOAD PRODUCTS */

async function loadProducts(){

productList.innerHTML =
"<p>⏳ Ana ɗauko products...</p>";

try{

const snapshot =
await getDocs(
collection(db,"products")
);

productList.innerHTML="";


if(snapshot.empty){

productList.innerHTML =
"<p>🛍️ Babu products tukuna.</p>";

return;

}


snapshot.forEach(
function(documentSnapshot){

const product =
documentSnapshot.data();

const productId =
documentSnapshot.id;


const card =
document.createElement("div");

card.className="product";


const image =
document.createElement("img");

image.src =
product.imageUrl || "";

image.alt =
product.name || "Product";


const info =
document.createElement("div");

info.className="product-info";


const title =
document.createElement("h3");

title.textContent =
product.name || "";


const price =
document.createElement("div");

price.className="price";

price.textContent =
"₦"+
Number(
product.price || 0
).toLocaleString();


const category =
document.createElement("div");

category.className="category";

category.textContent =
product.category || "";


const description =
document.createElement("p");

description.textContent =
product.description || "";


const deleteButton =
document.createElement("button");

deleteButton.className =
"delete-btn";

deleteButton.textContent =
"🗑️ Delete Product";


deleteButton.addEventListener(
"click",
function(){

deleteProduct(productId);

}
);


info.appendChild(title);

info.appendChild(price);

info.appendChild(category);

info.appendChild(description);

info.appendChild(deleteButton);

card.appendChild(image);

card.appendChild(info);

productList.appendChild(card);

}
);

}

catch(error){

console.error(error);

productList.innerHTML =
"❌ An kasa ɗauko products: "+
error.message;

}

}


/* DELETE */

async function deleteProduct(id){

const confirmed =
confirm(
"Ka tabbatar kana son cire wannan product?"
);

if(!confirmed){

return;

}

try{

await deleteDoc(
doc(
db,
"products",
id
)
);

alert(
"✅ An cire product cikin nasara."
);

await loadProducts();

}

catch(error){

console.error(error);

alert(
"❌ An kasa cire product: "+
error.message
);

}

}


/* CLEAR */

function clearForm(){

productForm.reset();

preview.src="";

preview.style.display="none";

preview.dataset.image="";

imageInfo.textContent="";

productMessage.textContent="";

}


document
.getElementById("clearBtn")
.addEventListener(
"click",
clearForm
);

</script>

</body>
  </html>
